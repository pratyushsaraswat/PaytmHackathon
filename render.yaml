services:
  - type: web                  # a public web service
    name: paytm-trust-growth   # becomes the URL: paytm-trust-growth.onrender.com
    runtime: docker            # builds from your Dockerfile
    plan: free                 # free tier (sleeps when idle, disk resets)
    healthCheckPath: /api/health   # Render pings this to know the app is up
    envVars:
      - key: SERPAPI_KEY
        sync: false            # "ask me for the value"; never stored in Git
      - key: LLM_PROVIDER
        value: openai          # use OpenAI (now honored by the updated ai.py)
      - key: OPENAI_API_KEY
        sync: false            # you paste it in Render
      - key: OPENAI_MODEL
        value: gpt-4o-mini     # cheap and fast; fine for this task
      - key: DEMO_REPEAT
        value: "1"             # repeat reports in the demo